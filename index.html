<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ernest · 个人主页</title>
<style>
  :root {
    --bg: #111318;
    --panel: rgba(24, 27, 33, 0.72);
    --panel-hover: rgba(34, 38, 47, 0.82);
    --border: rgba(255, 255, 255, 0.09);
    --text: #e2e5ea;
    --text-dim: #8b919c;
    --accent: #7aa2e8;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
  }

  /* ----- 背景光斑：低饱和暗色，让毛玻璃的模糊有内容可折射 ----- */
  .backdrop { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .backdrop i { position: absolute; border-radius: 50%; filter: blur(110px); opacity: .16; }
  .backdrop i.g1 { width: 44vw; height: 44vw; background: #3d5db3; top: -14%; left: -6%; }
  .backdrop i.g2 { width: 36vw; height: 36vw; background: #5e4a9e; bottom: -12%; right: -4%; }
  .backdrop i.g3 { width: 26vw; height: 26vw; background: #2e6e66; top: 34%; left: 38%; opacity: .10; }

  .layout {
    position: relative; z-index: 1;
    display: flex; gap: 24px;
    max-width: 1280px; margin: 0 auto;
    padding: 32px 24px;
  }

  /* ----- 毛玻璃卡片 ----- */
  .card-base {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    backdrop-filter: blur(18px) saturate(1.25);
    -webkit-backdrop-filter: blur(18px) saturate(1.25);
    box-shadow: 0 4px 24px rgba(0, 0, 0, .25);
  }

  /* ----- 线条图标通用样式 ----- */
  .icon-svg {
    width: 17px; height: 17px; flex-shrink: 0;
    stroke: currentColor; fill: none;
    stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
  }
  .icon-sm { width: 14px; height: 14px; }

  /* ============ 左侧边栏 ============ */
  .sidebar {
    width: 260px; flex-shrink: 0;
    position: sticky; top: 32px;
    align-self: flex-start;
    display: flex; flex-direction: column; gap: 20px;
  }
  nav.menu { padding: 10px; }
  .menu-group {
    display: flex; align-items: center; gap: 10px;
    font-size: 14px; font-weight: 600; color: var(--text);
    padding: 10px 14px; border-radius: 8px; cursor: pointer;
    transition: background .15s;
  }
  .menu-group:hover { background: rgba(255, 255, 255, .05); }
  .menu-group.active { background: rgba(122, 162, 232, .12); }
  .menu-group.active .icon-svg { color: var(--accent); }
  .menu-sub { margin: 2px 0 6px; }
  .menu-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px 8px 41px; border-radius: 8px;
    font-size: 13px; cursor: pointer;
    color: var(--text-dim);
    transition: background .15s, color .15s;
  }
  .menu-item:hover { background: rgba(255, 255, 255, .05); color: var(--text); }
  .menu-item.active { color: var(--text); background: rgba(122, 162, 232, .10); font-weight: 500; }

  .sidebar-foot { padding: 14px 20px; font-size: 12px; display: flex; align-items: center; }
  .sidebar-foot a {
    color: var(--text-dim); text-decoration: none;
    display: flex; align-items: center; gap: 8px;
    transition: color .15s;
  }
  .sidebar-foot a:hover { color: var(--text); }

  /* ============ 右侧主区 ============ */
  .main { flex: 1; min-width: 0; }

  /* 瀑布流 */
  .masonry { columns: 3 250px; column-gap: 18px; }
  .card { break-inside: avoid; margin-bottom: 18px; padding: 20px; transition: border-color .2s, background .2s; }
  .card:hover { border-color: rgba(255, 255, 255, .16); background: var(--panel-hover); }

  .card .cat {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--text-dim); margin-bottom: 8px;
  }
  .card .cat .icon-svg { color: var(--accent); opacity: .85; }
  .card h3 { font-size: 15px; font-weight: 600; line-height: 1.55; margin-bottom: 8px; }
  .card p { font-size: 13px; color: var(--text-dim); line-height: 1.8; }
  .card .meta { margin-top: 12px; font-size: 12px; color: var(--text-dim); display: flex; gap: 12px; flex-wrap: wrap; }
  .card .meta .pill { color: #767c87; }

  /* 视频卡片 */
  .video-cover {
    margin: 8px -20px 14px; aspect-ratio: 16 / 9;
    background: rgba(16, 18, 23, .6); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    position: relative; cursor: pointer; color: #5a5f6a; font-size: 13px;
    overflow: hidden;
  }
  .video-cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .video-cover .play-line {
    position: relative; z-index: 1;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(10, 12, 16, .55);
    border: 1.5px solid rgba(255, 255, 255, .75);
    display: flex; align-items: center; justify-content: center;
    transition: transform .2s, background .2s;
  }
  .video-cover:hover .play-line { transform: scale(1.08); background: rgba(10, 12, 16, .75); }
  .video-cover iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .video-cover .badge {
    position: absolute; bottom: 8px; right: 10px; z-index: 1; font-size: 11px;
    background: rgba(0,0,0,.65); color: #c9cdd4; padding: 2px 7px; border-radius: 4px;
  }
  .video-cover .bili {
    position: absolute; top: 8px; left: 10px; z-index: 1; font-size: 11px;
    color: var(--text-dim); background: rgba(24,27,33,.85); border: 1px solid var(--border);
    padding: 2px 8px; border-radius: 4px;
  }

  /* 文章卡片 */
  .article-cover {
    display: block; margin: 8px -20px 14px; aspect-ratio: 16 / 7;
    overflow: hidden; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  }
  .article-cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
  .card:hover .article-cover img { transform: scale(1.03); }
  .article-link { color: inherit; text-decoration: none; transition: color .15s; }
  .article-link:hover { color: var(--accent); }

  /* 空栏目占位 */
  .empty-hint {
    padding: 48px 20px; text-align: center;
    color: var(--text-dim); font-size: 14px;
  }

  .foot { text-align: center; padding: 28px 0 8px; font-size: 12px; color: var(--text-dim); }

  @media (max-width: 980px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; position: static; }
    nav.menu { display: flex; flex-wrap: wrap; }
    .menu-group, .menu-item { flex-shrink: 0; }
  }
</style>
</head>
<body>

<!-- 低饱和背景光斑（毛玻璃折射源） -->
<div class="backdrop"><i class="g1"></i><i class="g2"></i><i class="g3"></i></div>

<div class="layout">

  <!-- ============ 左侧边栏（由 content.js 渲染） ============ -->
  <aside class="sidebar">
    <nav class="card-base menu" id="menu"></nav>

    <div class="card-base sidebar-foot">
      <a href="https://github.com/SolidStateYu">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></svg>
        GitHub
      </a>
    </div>
  </aside>

  <!-- ============ 右侧主区（由 content.js 渲染） ============ -->
  <main class="main">
    <section class="masonry" id="masonry"></section>
    <div class="foot">Powered by GitHub Pages</div>
  </main>
</div>

<script src="content.js"></script>
<script>
  // ----- 栏目图标（线条 SVG） -----
  const SECTION_ICONS = {
    "ai-vision": '<svg class="icon-svg" viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/><circle cx="12" cy="12" r="3.2"/></svg>',
    "ai-productivity": '<svg class="icon-svg" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg>',
    "vlog": '<svg class="icon-svg" viewBox="0 0 24 24"><rect x="3" y="7" width="12" height="10" rx="2"/><path d="M15 11l6-3.5v9L15 13"/></svg>',
    "reading": '<svg class="icon-svg" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5V5.5z"/><path d="M4 18a2.5 2.5 0 0 0 2.5 2.5H20"/></svg>',
    "tech-blog": '<svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4L16.5 3.5z"/></svg>',
  };

  // ----- 渲染导航 -----
  const menu = document.getElementById('menu');
  menu.innerHTML = SITE_DATA.sections.map(s => {
    const subs = (s.subs || []).map(sub =>
      `<div class="menu-item" data-section="${s.id}" data-sub="${sub.id}">${sub.name}</div>`
    ).join('');
    const subHtml = s.subs ? `<div class="menu-sub">${subs}</div>` : '';
    return `<div class="menu-group" data-section="${s.id}">${SECTION_ICONS[s.id] || ''}${s.name}</div>${subHtml}`;
  }).join('');

  // ----- 渲染卡片 -----
  function fmtDur(sec) {
    const m = Math.floor(sec / 60), s = sec % 60;
    return `${m}:${String(s).padStart(2, '0')}`;
  }
  const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,' ');

  function renderCard(c) {
    if (c.type === 'video') {
      return `<article class="card-base card">
        <h3>${esc(c.title)}</h3>
        <div class="video-cover" data-bvid="${c.bvid}">
          <img src="${c.pic}@480w_270h_1c.webp" alt="视频封面" loading="lazy">
          <span class="bili">bilibili</span>
          <div class="play-line">
            <svg class="icon-svg" viewBox="0 0 24 24" style="color:#fff"><path d="M8 5.5v13l10-6.5-10-6.5z"/></svg>
          </div>
          <span class="badge">${fmtDur(c.duration)}</span>
        </div>
        <div class="cat">${SECTION_ICONS['vlog'].replace('icon-svg','icon-svg icon-sm')}哔哩哔哩 · 视频</div>
        <p>${esc(c.desc || '')}</p>
        <div class="meta"><span class="pill">${c.views} 播放</span><span>${c.date}</span></div>
      </article>`;
    }
    if (c.type === 'article') {
      const cover = c.pic ? `<a class="article-cover" href="${c.url}" target="_blank" rel="noopener"><img src="${c.pic}" alt="" loading="lazy"></a>` : '';
      return `<article class="card-base card">
        <h3><a class="article-link" href="${c.url}" target="_blank" rel="noopener">${esc(c.title)}</a></h3>
        ${cover}
        <div class="cat">${(SECTION_ICONS[c.section] || '').replace('icon-svg','icon-svg icon-sm')}${c.section === 'reading' ? '读书笔记' : '科技博文'}</div>
        <p>${esc(c.desc || '')}</p>
        <div class="meta"><span class="pill">${c.words} 字</span><span class="pill">${c.views} 阅读</span><span>${c.date}</span></div>
      </article>`;
    }
    return '';
  }

  const masonry = document.getElementById('masonry');

  // ----- 栏目过滤 -----
  let currentSection = null, currentSub = null;
  function filterCards() {
    const cards = SITE_DATA.cards.filter(c =>
      (!currentSection || c.section === currentSection) &&
      (!currentSub || !c.sub || c.sub === currentSub));
    masonry.innerHTML = cards.map(renderCard).join('')
      || `<div class="card-base empty-hint" style="width:100%">「${esc(currentName())}」栏目内容整理中，敬请期待</div>`;
    bindVideoCovers();
  }
  function currentName() {
    const s = SITE_DATA.sections.find(s => s.id === currentSection);
    if (s && s.subs && currentSub) {
      const sub = s.subs.find(x => x.id === currentSub);
      return sub ? sub.name : s.name;
    }
    return s ? s.name : '';
  }

  // ----- 视频点击加载 B 站播放器（懒加载） -----
  function bindVideoCovers() {
    document.querySelectorAll('.video-cover[data-bvid]').forEach(cover => {
      cover.addEventListener('click', () => {
        const iframe = document.createElement('iframe');
        iframe.src = `https://player.bilibili.com/player.html?bvid=${cover.dataset.bvid}&page=1&high_quality=1&danmaku=0&autoplay=1`;
        iframe.setAttribute('allowfullscreen', '');
        iframe.setAttribute('scrolling', 'no');
        iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-popups');
        cover.innerHTML = '';
        cover.appendChild(iframe);
        cover.style.cursor = 'default';
      }, { once: true });
    });
  }

  // ----- 导航交互 -----
  function activate(el, selector) {
    document.querySelectorAll(selector + '.active').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
  }
  document.querySelectorAll('.menu-group').forEach(item => {
    item.addEventListener('click', () => {
      activate(item, '.menu-group');
      document.querySelectorAll('.menu-item.active').forEach(n => n.classList.remove('active'));
      currentSection = item.dataset.section;
      currentSub = null;
      filterCards();
    });
  });
  document.querySelectorAll('.menu-item').forEach(item => {
    item.addEventListener('click', () => {
      activate(item, '.menu-item');
      const group = item.closest('.menu-sub')?.previousElementSibling;
      if (group) activate(group, '.menu-group');
      currentSection = item.dataset.section;
      currentSub = item.dataset.sub;
      filterCards();
    });
  });

  // 默认展示第一个有内容的栏目
  const firstSection = SITE_DATA.sections.find(s =>
    SITE_DATA.cards.some(c => c.section === s.id)) || SITE_DATA.sections[0];
  const firstBtn = menu.querySelector(`.menu-group[data-section="${firstSection.id}"]`);
  firstBtn.classList.add('active');
  currentSection = firstSection.id;
  filterCards();
</script>
</body>
</html>
